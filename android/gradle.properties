# user.language/country pin the build JVM to the Gregorian calendar. On a Thai-locale
# Windows machine the default calendar is Buddhist (year 2569), which overflows the
# MS-DOS zip date field (max 2107) and crashes mergeJavaResource with a VerifyException.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
