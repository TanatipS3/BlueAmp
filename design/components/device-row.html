<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BlueAmp — Device Row States</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --accent:         #00C853;
    --error:          #FF5252;
    --bg:             #1c1c1c;
    --surface:        #272727;
    --surface-2:      #303030;
    --border:         rgba(255,255,255,0.08);
    --text-primary:   #F0F0F0;
    --text-secondary: #888;
    --text-muted:     #4a4a4a;
    --radius:         8px;
    --radius-sm:      5px;
  }

  body {
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
    padding: 40px;
    flex-direction: column;
    gap: 10px;
  }

  .state-label {
    font-size: 10px;
    color: #444;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    align-self: flex-start;
    margin-left: 4px;
    margin-top: 6px;
  }

  /* The row itself — shown in 320px container to match popup */
  .row-shell {
    width: 320px;
    background: rgba(28,28,28,0.96);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 4px 8px;
  }

  .device-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border-radius: var(--radius-sm);
  }
  .device-row.hover { background: rgba(255,255,255,0.05); }

  .device-icon {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    background: var(--surface-2);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .device-info { flex: 1; min-width: 0; }
  .device-name {
    font-size: 13px;
    color: var(--text-primary);
    font-weight: 450;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .device-sub {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 1px;
  }
  .device-sub.connected { color: var(--accent); }
  .device-sub.error     { color: var(--error); }

  .connect-btn {
    font-size: 11px;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 4px;
    border: none;
    cursor: pointer;
    flex-shrink: 0;
    font-family: inherit;
    letter-spacing: 0.2px;
  }
  .btn-connect    { background: var(--accent); color: #000; }
  .btn-disconnect { background: var(--surface-2); color: var(--text-secondary); }
  .btn-connecting {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
    cursor: default;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .btn-error { background: rgba(255,82,82,0.12); color: var(--error); border: 1px solid rgba(255,82,82,0.2); }

  /* Spinner */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    width: 10px;
    height: 10px;
    border: 1.5px solid #333;
    border-top-color: #666;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
</style>
</head>
<body>

<div class="state-label">Available</div>
<div class="row-shell">
  <div class="device-row">
    <div class="device-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2">
        <path d="M12 2l3.5 3.5L12 9V2z"/><path d="M12 15l3.5 3.5L12 22v-7z"/>
        <path d="M8.5 5.5L12 9l-3.5 3.5"/><path d="M8.5 18.5L12 15l-3.5-3.5"/>
      </svg>
    </div>
    <div class="device-info">
      <div class="device-name">Samsung Galaxy S24</div>
      <div class="device-sub">Available</div>
    </div>
    <button class="connect-btn btn-connect">Connect</button>
  </div>
</div>

<div class="state-label">Connecting…</div>
<div class="row-shell">
  <div class="device-row">
    <div class="device-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2">
        <path d="M12 2l3.5 3.5L12 9V2z"/><path d="M12 15l3.5 3.5L12 22v-7z"/>
        <path d="M8.5 5.5L12 9l-3.5 3.5"/><path d="M8.5 18.5L12 15l-3.5-3.5"/>
      </svg>
    </div>
    <div class="device-info">
      <div class="device-name">Samsung Galaxy S24</div>
      <div class="device-sub">Connecting…</div>
    </div>
    <button class="connect-btn btn-connecting">
      <div class="spinner"></div>
      Cancel
    </button>
  </div>
</div>

<div class="state-label">Connected · Audio Active</div>
<div class="row-shell">
  <div class="device-row">
    <div class="device-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#00C853" stroke-width="2">
        <path d="M12 2l3.5 3.5L12 9V2z"/><path d="M12 15l3.5 3.5L12 22v-7z"/>
        <path d="M8.5 5.5L12 9l-3.5 3.5"/><path d="M8.5 18.5L12 15l-3.5-3.5"/>
      </svg>
    </div>
    <div class="device-info">
      <div class="device-name">Samsung Galaxy S24</div>
      <div class="device-sub connected">Connected · A2DP · Audio active</div>
    </div>
    <button class="connect-btn btn-disconnect">Disconnect</button>
  </div>
</div>

<div class="state-label">Connected · Silent</div>
<div class="row-shell">
  <div class="device-row">
    <div class="device-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#00C853" stroke-width="2">
        <path d="M12 2l3.5 3.5L12 9V2z"/><path d="M12 15l3.5 3.5L12 22v-7z"/>
        <path d="M8.5 5.5L12 9l-3.5 3.5"/><path d="M8.5 18.5L12 15l-3.5-3.5"/>
      </svg>
    </div>
    <div class="device-info">
      <div class="device-name">Samsung Galaxy S24</div>
      <div class="device-sub connected">Connected · A2DP · Silent</div>
    </div>
    <button class="connect-btn btn-disconnect">Disconnect</button>
  </div>
</div>

<div class="state-label">Failed</div>
<div class="row-shell">
  <div class="device-row">
    <div class="device-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FF5252" stroke-width="2">
        <path d="M12 2l3.5 3.5L12 9V2z"/><path d="M12 15l3.5 3.5L12 22v-7z"/>
        <path d="M8.5 5.5L12 9l-3.5 3.5"/><path d="M8.5 18.5L12 15l-3.5-3.5"/>
      </svg>
    </div>
    <div class="device-info">
      <div class="device-name">Samsung Galaxy S24</div>
      <div class="device-sub error">Connection timed out</div>
    </div>
    <button class="connect-btn btn-error">Retry</button>
  </div>
</div>

</body>
</html>
