name: Build

# Compile and run the tests on every push and pull request, so a broken build is
# caught before it reaches a release tag.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # 8.0 is the runtime the app and tests target; the 9.0 SDK is needed to
          # build the .slnx solution format.
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Build
        run: dotnet build BlueAmp.slnx -c Release

      - name: Test
        run: dotnet test BlueAmp.slnx -c Release --no-build
