name: Release

# Push a tag like v1.0.0 to publish the app, build the installer,
# and attach it to a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Version from tag
        id: v
        shell: pwsh
        run: '"version=$($env:GITHUB_REF_NAME.TrimStart(''v''))" >> $env:GITHUB_OUTPUT'

      # Framework-dependent keeps the app's low memory profile (~11-16 MB private
      # vs ~56 MB self-contained); targets need the .NET 8 Desktop Runtime, which
      # the installer checks for.
      - name: Publish (framework-dependent single file)
        run: >
          dotnet publish src/BlueAmp/BlueAmp.csproj
          -c Release -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:Version=${{ steps.v.outputs.version }}
          -o publish

      - name: Build installer
        shell: pwsh
        run: >
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          installer\BlueAmp.iss
          /DAppVersion=${{ steps.v.outputs.version }}
          /DPublishDir=..\publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/BlueAmp-Setup-*.exe
          generate_release_notes: true
